    sourceText: A directory identity, keyed on their Entra object id, created the
      first time they sign in. It also carries the moment they last changed any
      level. That timestamp is the other half of the New toggle, and it has to
      survive them clearing every level they hold - so it belongs on the person,
      not derived from their claims.
