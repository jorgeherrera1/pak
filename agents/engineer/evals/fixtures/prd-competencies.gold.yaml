  - id: ux-constraint-01
    type: ux-constraint
    parentId: product
    elementIds:
      - paragraphs/76
    sourceText: "The shape of the thing is right and we are keeping it: one flat
      grid, one row per competency, showing its Type, its Area and its name,
      with three tick columns for the level. Above the grid, a filter row with a
      Type dropdown, an Area dropdown and a free-text box for the competency
      name. Rows come out sorted by Type, then Area, then competency name, so
      the grid reads the same way every time."
    fields:
