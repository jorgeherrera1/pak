      - tables/2/cells/5
    sourceText: "One person, one competency, one level: Learner, Advanced or Expert.
      At most one of these per person per competency - the storage itself should
      make two impossible, rather than relying on the screen to prevent it. No
      record at all means unrated. This is personal data: we keep it until
      twelve months after the person's account is disabled, and it never goes
      into logs."
