      - paragraphs/142
      - paragraphs/147
    sourceText: The app stands alone. It owns its own PostgreSQL database and has
      exactly one live dependency - Microsoft Entra ID, for sign- in over OIDC
      with the authorization-code flow and PKCE. The dashed line is a one-time
      load of the catalogue and the existing assessments out of the old Power
      Apps app; after go-live there is no connection between the two.
