  fields:
    name: Competencies
    description: One screen where a consultant tells us what they are good at - and
      it sticks the moment they click.
    mission: We cannot answer "who knows Jira?" without asking people. The
      competency data we do have is stale, and the app that holds it is the
      reason why.
    definition: "We are rebuilding it as a small Next.js/React app. The bet is
      narrow: make recording a level a single click that needs no saving, and
      people will keep their own profile current."
    systemContext: The app stands alone. It owns its own PostgreSQL database and has
      exactly one live dependency - Microsoft Entra ID, for sign- in over OIDC
      with the authorization-code flow and PKCE. The dashed line is a one-time
      load of the catalogue and the existing assessments out of the old Power
      Apps app; after go-live there is no connection between the two.
