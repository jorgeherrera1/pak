      - paragraphs/84
      - paragraphs/119
      - paragraphs/120
      - paragraphs/121
      - paragraphs/122
      - paragraphs/123
      - tables/1/cells/5
    sourceText: Every level change is written as it happens, with no further action
      from the person. There is no Save button, no counter, no "you have unsaved
      changes" prompt.
    fields:
      requirement: Every level change is written as it happens, with no further action
        from the person. There is no Save button, no counter, no "you have
        unsaved changes" prompt.
  - id: FR-008
    type: functional-requirement
    parentId: FEAT-02
    elementIds:
      - paragraphs/9
      - paragraphs/124
      - paragraphs/125
      - paragraphs/126
      - paragraphs/127
      - paragraphs/128
    sourceText: If a level change fails to write, the row goes back to its last
      saved level and a non-blocking message names the competency and says it
      was not saved. The person is never left looking at a tick that does not
      exist in the database. A write that is merely slow, but succeeds, is left
      alone.
    fields:
