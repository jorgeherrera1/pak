      - paragraphs/115
      - paragraphs/116
      - paragraphs/117
      - paragraphs/118
    sourceText: Unticking the level a row currently holds deletes the claim outright
      and returns the row to unrated - which is a real state, distinct from
      "Learner".
    fields:
