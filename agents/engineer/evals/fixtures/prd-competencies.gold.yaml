  - id: FR-003
    type: functional-requirement
    parentId: FEAT-01
    elementIds:
      - paragraphs/97
      - paragraphs/98
      - paragraphs/99
      - paragraphs/100
      - paragraphs/101
    sourceText: With Mine switched on, the grid shows only competencies where this
      person has a level recorded. Everything else drops away.
    fields:
      requirement: With Mine switched on, the grid shows only competencies where this
        person has a level recorded. Everything else drops away.
  - id: FR-004
    type: functional-requirement
    parentId: FEAT-01
    elementIds:
      - paragraphs/10
      - paragraphs/102
      - paragraphs/103
      - paragraphs/104
      - paragraphs/105
      - paragraphs/106
      - paragraphs/107
    sourceText: With New switched on, the grid shows only competencies that were
      added to the catalogue after the last time this person changed any of
      their own levels. "New" is personal and relative - it is not a fixed
      window like "the last 30 days". Someone who last touched their levels
      forty-five days ago sees exactly what the catalogue gained in those
      forty-five days. Someone who has never recorded a level sees everything,
      because all of it is new to them.
    fields:
      requirement: With New switched on, the grid shows only competencies that were
        added to the catalogue after the last time this person changed any of
        their own levels. "New" is personal and relative - it is not a fixed
        window like "the last 30 days". Someone who last touched their levels
        forty-five days ago sees exactly what the catalogue gained in those
        forty-five days. Someone who has never recorded a level sees everything,
        because all of it is new to them.
  - id: FR-005
    type: functional-requirement
    parentId: FEAT-02
    elementIds:
      - paragraphs/109
      - paragraphs/110
      - paragraphs/111
      - paragraphs/112
      - paragraphs/113
    sourceText: Ticking a level on a row that already holds a different one records
      the new level and clears the old, leaving exactly one of Learner,
      Advanced, Expert ticked on that row. Re-ticking the level you already hold
      is a no-op - it should not generate a second write.
    fields:
      requirement: Ticking a level on a row that already holds a different one records
        the new level and clears the old, leaving exactly one of Learner,
        Advanced, Expert ticked on that row. Re-ticking the level you already
        hold is a no-op - it should not generate a second write.
  - id: FR-006
    type: functional-requirement
    parentId: FEAT-02
    elementIds:
